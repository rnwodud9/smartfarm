<!DOCTYPE html>
<!--
  스마트팜 모니터링 대시보드
  ── 버전: 2026-09-10-kst2 ─────────────────────────────
  이전(형 rnwodud9/smartfarm 배포본)과 구분점:
    1. 측정 시각을 항상 한국시간(Asia/Seoul)으로 표시  → kstParts()
    2. <!DOCTYPE html> 유지 (배포본은 브라우저 저장으로 유실 → quirks 모드)
    3. 배포본에 섞여든 /.netlify/scripts/hud 스크립트, 박제된 에러 문구 제거
    4. Supabase 클라이언트 변수명 supabaseClient (형 변경분 반영)
    5. 폴링 간격 완화: 실시간 15s→30s, 최근7일 60s→5분 (Supabase egress 절약)
    6. 안 보이는 탭은 폴링 정지 (document.hidden) + 복귀 시 즉시 갱신
  권장: sensor_data(created_at) 인덱스 추가 (supabase/enable-public-read.sql 참고)
  기준 저장소: rnwodud9/smartfarm   배포: https://smurffarm.netlify.app
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트팜 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 16px;
            min-height: 18px;
        }

        .status.error { color: #e74c3c; }

        /* 실시간 / 최근 7일 전환 버튼 */
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .mode-switch button {
            border: 2px solid #d7dee3;
            background: #ffffff;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .mode-switch button:hover { border-color: #3498db; color: #3498db; }

        .mode-switch button.active {
            background: #3498db;
            border-color: #3498db;
            color: #ffffff;
        }

        .chart-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            position: relative;
            height: 380px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .card.active {
            border-color: #3498db;
            background-color: #f0f7ff;
        }

        .card h3 {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>스마트팜 모니터링 대시보드</h1>
        <div class="status" id="status">불러오는 중…</div>

        <div class="mode-switch">
            <button id="mode-live" class="active" onclick="switchMode('live')">실시간</button>
            <button id="mode-week" onclick="switchMode('week')">최근 7일</button>
        </div>

        <div class="chart-container">
            <canvas id="sensorChart"></canvas>
        </div>

        <div class="cards-grid">
            <div class="card active" onclick="switchSensor('ph')" id="card-ph">
                <h3>pH</h3>
                <div class="value" id="val-ph">--</div>
            </div>
            <div class="card" onclick="switchSensor('ec')" id="card-ec">
                <h3>EC (mS/cm)</h3>
                <div class="value" id="val-ec">--</div>
            </div>
            <div class="card" onclick="switchSensor('temp')" id="card-temp">
                <h3>온도 (°C)</h3>
                <div class="value" id="val-temp">--</div>
            </div>
            <div class="card" onclick="switchSensor('humidity')" id="card-humidity">
                <h3>습도 (%)</h3>
                <div class="value" id="val-humidity">--</div>
            </div>
        </div>

        <div style="text-align:center;font-size:11px;color:#b0b8bd;margin-top:16px;">
            smartfarm dashboard · v2026-09-10-kst2 · 시각 KST · 실시간 30s / 최근7일 5분 갱신
        </div>
    </div>

    <!-- Supabase 접속 정보 -->
    <script src="config.js"></script>
    <script>
        // ================= 설정 =================
        const DEVICE_ID = null;   // 장치 구분 컬럼이 생기면 여기에 값 지정

        // 모드별 조회 방식
        const MODES = {
            live: {
                btn: 'mode-live',
                table: window.SUPABASE_TABLE_RAW || 'sensor_data',
                // sensor_data 는 컬럼명이 "PH" "EC" + 한글 "온도" "습도" → 따옴표 필수
                select: '"PH","EC","온도","습도",created_at',
                tkey: 'created_at',
                col: { ph: 'PH', ec: 'EC', temp: '온도', humidity: '습도' },
                sinceMs: 30 * 60 * 1000,   // 최근 30분
                cap: 800,
                refreshMs: 30000,          // 30초 (요청/egress 절약)
                fmt: (iso) => { const p = kstParts(iso); return `${p.hour}:${p.minute}:${p.second}`; },
            },
            week: {
                btn: 'mode-week',
                table: window.SUPABASE_TABLE_5MIN || 'sensor_5min',
                select: 'ph,ec,temp,humidity,bucket',
                tkey: 'bucket',
                col: { ph: 'ph', ec: 'ec', temp: 'temp', humidity: 'humidity' },
                sinceMs: 7 * 24 * 60 * 60 * 1000,   // 최근 7일
                cap: 3000,
                refreshMs: 300000,         // 5분 (버킷 간격과 동일 — 더 자주 할 이유 없음)
                fmt: (iso) => { const p = kstParts(iso); return `${+p.month}/${+p.day} ${p.hour}:${p.minute}`; },
            },
        };

        const META = {
            ph:       { label: 'pH',        color: '#e74c3c' },
            ec:       { label: 'EC (mS/cm)', color: '#e67e22' },
            temp:     { label: '온도 (°C)',  color: '#3498db' },
            humidity: { label: '습도 (%)',   color: '#2ecc71' },
        };

        const statusEl = document.getElementById('status');
        let supabaseClient = null;
        let myChart = null;
        let currentSensor = 'ph';
        let currentMode = 'live';
        let series = emptySeries();
        let timer = null;

        function emptySeries() {
            return { ph: [], ec: [], temp: [], humidity: [], times: [] };
        }

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.classList.toggle('error', !!isError);
        }

        function toNum(v) {
            return (v === null || v === undefined || v === '') ? null : Number(v);
        }

        // 시각 표시는 항상 한국시간(KST) 고정 — 보는 기기의 시간대와 무관
        function kstParts(t) {
            const o = {};
            for (const p of new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Seoul',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
            }).formatToParts(new Date(t))) o[p.type] = p.value;
            if (o.hour === '24') o.hour = '00';
            return o;
        }

        function initClient() {
            const url = window.SUPABASE_URL;
            const key = window.SUPABASE_ANON_KEY;
            if (!url || !key || String(key).includes('YOUR_')) {
                setStatus('config.js 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 설정하세요.', true);
                return false;
            }
            supabaseClient = window.supabase.createClient(url, key);
            return true;
        }

        // ---- 그래프 데이터 (모드별) ----
        async function loadChartData() {
            const m = MODES[currentMode];
            let q = supabaseClient
                .from(m.table)
                .select(m.select)
                .gte(m.tkey, new Date(Date.now() - m.sinceMs).toISOString())
                .order(m.tkey, { ascending: true })
                .limit(m.cap);
            if (DEVICE_ID) q = q.eq('device_id', DEVICE_ID);

            const { data, error } = await q;
            if (error) {
                setStatus('그래프 조회 오류: ' + error.message, true);
                return;
            }

            series = emptySeries();
            for (const r of (data || [])) {
                series.times.push(m.fmt(r[m.tkey]));
                series.ph.push(toNum(r[m.col.ph]));
                series.ec.push(toNum(r[m.col.ec]));
                series.temp.push(toNum(r[m.col.temp]));
                series.humidity.push(toNum(r[m.col.humidity]));
            }
            drawChart(currentSensor);

            const modeLabel = currentMode === 'live' ? '실시간(최근 30분)' : '최근 7일 · 5분 간격';
            if (!data || data.length === 0) {
                setStatus(modeLabel + ' · 표시할 데이터 없음');
            } else {
                setStatus(modeLabel + ' · ' + data.length + '개 지점 · ' + nowHm() + ' KST 갱신');
            }
        }

        // ---- 카드 값: 항상 원본 최신 1행 ----
        async function loadLatest() {
            const raw = MODES.live;
            let q = supabaseClient
                .from(raw.table)
                .select(raw.select)
                .order('created_at', { ascending: false })
                .limit(1);
            if (DEVICE_ID) q = q.eq('device_id', DEVICE_ID);

            const { data, error } = await q;
            if (error || !data || !data.length) return;
            const r = data[0];
            setValue('ph', r[raw.col.ph]);
            setValue('ec', r[raw.col.ec]);
            setValue('temp', r[raw.col.temp]);
            setValue('humidity', r[raw.col.humidity]);
        }

        function setValue(key, v) {
            const n = toNum(v);
            document.getElementById('val-' + key).textContent =
                (n === null || Number.isNaN(n)) ? '--' : n;
        }

        function nowHm() {
            const p = kstParts(Date.now());
            return `${p.hour}:${p.minute}`;
        }

        function drawChart(sensorKey) {
            const meta = META[sensorKey];
            const ctx = document.getElementById('sensorChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: series.times,
                    datasets: [{
                        label: meta.label + (currentMode === 'week' ? ' · 5분 평균' : ' · 실시간'),
                        data: series[sensorKey],
                        borderColor: meta.color,
                        backgroundColor: meta.color + '22',
                        borderWidth: 2.5,
                        pointRadius: series.times.length > 60 ? 0 : 3,
                        fill: true,
                        tension: 0.3,
                        spanGaps: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: true, position: 'top' } },
                    scales: {
                        x: { ticks: { maxTicksLimit: 8, autoSkip: true, maxRotation: 0 } },
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        function switchSensor(sensorKey) {
            currentSensor = sensorKey;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + sensorKey).classList.add('active');
            drawChart(sensorKey);
        }

        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            for (const key of Object.keys(MODES)) {
                document.getElementById(MODES[key].btn).classList.toggle('active', key === mode);
            }
            startPolling();   // 새 모드로 즉시 조회 + 주기 재설정
        }

        function refreshNow() {
            if (!supabaseClient) return;
            loadChartData();
            loadLatest();
        }

        function startPolling() {
            if (timer) clearInterval(timer);
            const tick = () => {
                if (document.hidden) return;   // 안 보이는 탭은 요청 안 함 (egress 절약)
                refreshNow();
            };
            tick();
            timer = setInterval(tick, MODES[currentMode].refreshMs);
        }

        window.onload = function () {
            drawChart('ph');            // 빈 차트 먼저
            if (!initClient()) return;
            startPolling();
            // 탭이 다시 보이면 즉시 한 번 갱신
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) refreshNow();
            });
        };
    </script>
</body>
</html>
