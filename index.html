<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스마트팜 모니터링 대시보드</title>
    <link rel="stylesheet" href="dashboard.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script type="module" src="dashboard.mjs"></script>
</head>
<body>
    <main class="container">
        <h1>스마트팜 모니터링 대시보드</h1>
        <div class="status" id="status" role="status">측정 기록을 불러오는 중…</div>

        <div class="mode-switch" role="group" aria-label="그래프 기간">
            <button type="button" data-mode="live" aria-pressed="true">실시간</button>
            <button type="button" data-mode="week" aria-pressed="false">최근 7일</button>
            <button type="button" data-mode="hourly" aria-pressed="false">최근 2개월</button>
            <button type="button" data-mode="all" aria-pressed="false">전체 기간</button>
        </div>

        <section class="chart-panel" aria-labelledby="chart-title">
            <div class="chart-head">
                <h2 id="chart-title">pH</h2>
                <span class="guide" id="guide"></span>
            </div>
            <div class="plot">
                <canvas id="sensorChart" role="img" aria-labelledby="chart-title" aria-describedby="guide status"></canvas>
                <p class="plot-message" id="plot-message" hidden></p>
            </div>
        </section>

        <div class="cards-grid" role="group" aria-label="그래프에 표시할 센서">
            <button type="button" class="card" data-sensor="ph" aria-pressed="true">
                <span class="name">pH</span><strong id="val-ph">—</strong>
            </button>
            <button type="button" class="card" data-sensor="ec" aria-pressed="false">
                <span class="name">EC (µS/cm)</span><strong id="val-ec">—</strong>
            </button>
            <button type="button" class="card" data-sensor="temp" aria-pressed="false">
                <span class="name">기온 (°C)</span><strong id="val-temp">—</strong>
            </button>
            <button type="button" class="card" data-sensor="humidity" aria-pressed="false">
                <span class="name">습도 (%)</span><strong id="val-humidity">—</strong>
            </button>
            <button type="button" class="card" data-sensor="water" aria-pressed="false">
                <span class="name">잔여 물량 (L)</span><strong id="val-water">—</strong>
                <span class="tank-detail" id="tank-detail">초음파 수신 대기</span>
            </button>
        </div>
    </main>
</body>
</html>
