<!DOCTYPE html>
<!--
  스마트팜 모니터링 대시보드
  ── 버전: 2026-09-17 ─────────────────────────────────
  주요 변경 이력:
    - 4개 탭 전부: 카테고리(순서나열) 축 → 실제 timestamp 기반 축으로 교체
      · 실시간: 눈금 5분 고정 간격, 점은 원래 수신 시각 그대로
      · 최근 7일/2개월: sensor_hourly 테이블이 실제 DB에 없어(retention.sql 미실행)
        sensor_5min을 읽어 클라이언트에서 1시간 평균으로 집계. 눈금은 하루/7일 간격
      · 전체 기간: sensor_daily 테이블도 없어 마찬가지로 sensor_5min → 하루 평균 집계.
        눈금 간격은 실제 데이터 기간에 맞춰 자동 조절(pickTickUnit)
      · 전 모드 spanGaps:false + 빈 구간 null 삽입 → 데이터 끊기면 선도 끊김
      · ⚠ retention.sql을 Supabase에서 실행하면(계정 소유자 권한 필요) 원래 설계대로
        전용 롤업 테이블을 쓰도록 되돌리는 게 장기적으로 맞음 — 지금 방식은 데이터가
        몇 달~년 단위로 쌓이면 sensor_5min 조회량이 커져 느려질 수 있음
    - 측정 시각을 항상 한국시간(Asia/Seoul)으로 표시  → kstParts()
    - <!DOCTYPE html> 유지 (브라우저 저장본은 유실 → quirks 모드)
    - 배포본에 섞여든 /.netlify/scripts/hud 스크립트, 박제된 에러 문구 제거
    - Supabase 클라이언트 변수명 supabaseClient
    - 폴링 완화: 실시간 30s / 최근7일 5분 / 최근2개월 30분 / 전체기간 1시간
    - 안 보이는 탭은 폴링 정지 (document.hidden) + 복귀 시 즉시 갱신
    - 4단 줌 사다리: 실시간(raw,5초) → 최근7일(5분) → 최근2개월(시간별)
      → 전체기간(일별). 저장 계층(raw/5min/hourly/daily)과 화면 탭 1:1 대응.
    - 그래프 포인트에 마우스 올리면 툴팁: 날짜(요일)+시각+정확한 수치
  필요 SQL: supabase/enable-public-read.sql (정책+인덱스),
            supabase/retention.sql (sensor_5min/hourly/daily 롤업 + raw 30일 보존, pg_cron)
  기준 저장소: rnwodud9/smartfarm   배포: https://smurffarm.netlify.app
-->

<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트팜 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 16px;
            min-height: 18px;
        }

        .status.error { color: #e74c3c; }

        /* 실시간 / 최근 7일 전환 버튼 */
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .mode-switch button {
            border: 2px solid #d7dee3;
            background: #ffffff;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .mode-switch button:hover { border-color: #3498db; color: #3498db; }

        .mode-switch button.active {
            background: #3498db;
            border-color: #3498db;
            color: #ffffff;
        }

        .chart-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            position: relative;
            height: 380px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .card.active {
            border-color: #3498db;
            background-color: #f0f7ff;
        }

        .card h3 {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>스마트팜 모니터링 대시보드</h1>
        <div class="status" id="status">실시간(최근 30분) · 표시할 데이터 없음</div>

        <div class="mode-switch">
            <button id="mode-live" class="active" onclick="switchMode('live')">실시간</button>
            <button id="mode-week" onclick="switchMode('week')">최근 7일</button>
            <button id="mode-hourly" onclick="switchMode('hourly')">최근 2개월</button>
            <button id="mode-all" onclick="switchMode('all')">전체 기간</button>
        </div>

        <div class="chart-container">
            <canvas id="sensorChart" style="box-sizing: border-box; display: block; height: 340px; width: 478.6px;" width="431" height="306"></canvas>
        </div>

        <div class="cards-grid">
            <div class="card active" onclick="switchSensor('ph')" id="card-ph">
                <h3>pH</h3>
                <div class="value" id="val-ph">6.2</div>
            </div>
            <div class="card" onclick="switchSensor('ec')" id="card-ec">
                <h3>EC (mS/cm)</h3>
                <div class="value" id="val-ec">1.4</div>
            </div>
            <div class="card" onclick="switchSensor('temp')" id="card-temp">
                <h3>온도 (°C)</h3>
                <div class="value" id="val-temp">25.8</div>
            </div>
            <div class="card" onclick="switchSensor('humidity')" id="card-humidity">
                <h3>습도 (%)</h3>
                <div class="value" id="val-humidity">63.3</div>
            </div>
        </div>

        <div style="text-align:center;font-size:11px;color:#b0b8bd;margin-top:16px;">
            smartfarm dashboard · v2026-09-17 · 시각 KST · 그래프 위 4단계(실시간/7일/2개월/전체) · 값 위 마우스 올리면 상세
        </div>
    </div>

    <!-- Supabase 접속 정보 -->
    <script src="config.js"></script>
    <script>
        // ================= 설정 =================
        const DEVICE_ID = null;   // 장치 구분 컬럼이 생기면 여기에 값 지정

        // 모드별 조회 방식
        const MODES = {
            live: {
                btn: 'mode-live',
                title: '실시간(최근 30분)',
                unit: '실시간',
                table: window.SUPABASE_TABLE_RAW || 'sensor_data',
                // sensor_data 는 컬럼명이 "PH" "EC" + 한글 "온도" "습도" → 따옴표 필수
                select: '"PH","EC","온도","습도",created_at',
                tkey: 'created_at',
                col: { ph: 'PH', ec: 'EC', temp: '온도', humidity: '습도' },
                sinceMs: 30 * 60 * 1000,   // 최근 30분
                cap: 800,
                refreshMs: 30000,          // 30초 (요청/egress 절약)
                tickUnitMs: 5 * 60 * 1000, // 눈금 5분 간격
                gapThresholdMs: 60 * 1000, // 1분 넘게 비면 선 끊기
                tickFmt: (t) => { const p = kstParts(t); return `${p.hour}:${p.minute}`; },
                fmt: (t) => { const p = kstParts(t); return `${p.hour}:${p.minute}:${p.second}`; },
                fullFmt: (t) => { const p = kstParts(t); return `${kstFullDate(t)} ${p.hour}:${p.minute}:${p.second}`; },
            },
            week: {
                btn: 'mode-week',
                title: '최근 7일 · 1시간 평균',
                unit: '1시간 평균',
                // sensor_hourly/sensor_daily 테이블이 실제 DB에 없어서(retention.sql 미실행)
                // sensor_5min을 그대로 읽어 클라이언트에서 원하는 간격으로 집계한다.
                table: window.SUPABASE_TABLE_5MIN || 'sensor_5min',
                select: 'ph,ec,temp,humidity,bucket',
                tkey: 'bucket',
                sinceMs: 7 * 24 * 60 * 60 * 1000,   // 최근 7일
                cap: 2200,                 // 7일 * 5분버킷(288/일) 여유분 포함
                refreshMs: 300000,         // 5분 (원본 버킷 갱신 주기와 동일)
                aggregateUnitMs: 60 * 60 * 1000,    // 5분 데이터를 1시간 평균으로 묶음
                tickUnitMs: 24 * 60 * 60 * 1000,    // 눈금 하루 간격
                gapThresholdMs: 1.5 * 60 * 60 * 1000,  // 1시간반 넘게 비면 선 끊기
                tickFmt: (t) => { const p = kstParts(t); return `${+p.month}/${+p.day}`; },
                fullFmt: (t) => { const p = kstParts(t); return `${kstFullDate(t)} ${p.hour}:${p.minute}`; },
            },
            hourly: {
                btn: 'mode-hourly',
                title: '최근 2개월 · 1시간 평균',
                unit: '1시간 평균',
                table: window.SUPABASE_TABLE_5MIN || 'sensor_5min',
                select: 'ph,ec,temp,humidity,bucket',
                tkey: 'bucket',
                sinceMs: 60 * 24 * 60 * 60 * 1000,   // 최근 60일
                cap: 20000,                // 60일 * 5분버킷(288/일) 여유분 포함
                refreshMs: 1800000,        // 30분
                aggregateUnitMs: 60 * 60 * 1000,     // 1시간 평균
                tickUnitMs: 7 * 24 * 60 * 60 * 1000, // 눈금 7일 간격
                gapThresholdMs: 3 * 60 * 60 * 1000,  // 3시간 넘게 비면 선 끊기
                tickFmt: (t) => { const p = kstParts(t); return `${+p.month}/${+p.day}`; },
                fullFmt: (t) => { const p = kstParts(t); return `${kstFullDate(t)} ${p.hour}:${p.minute}`; },
            },
            all: {
                btn: 'mode-all',
                title: '전체 기간 · 일별 평균',
                unit: '일별 평균',
                table: window.SUPABASE_TABLE_5MIN || 'sensor_5min',
                select: 'ph,ec,temp,humidity,bucket',
                tkey: 'bucket',
                sinceMs: 20 * 365 * 24 * 60 * 60 * 1000,   // 사실상 전체(20년) — 쌓인 만큼 다 보여줌
                cap: 50000,
                refreshMs: 3600000,        // 1시간
                aggregateUnitMs: 24 * 60 * 60 * 1000,   // 하루 평균
                dataRangeAxis: true,       // 눈금 범위를 실제 데이터 기간에 맞춤 (sinceMs 무의미)
                gapThresholdMs: 1.5 * 24 * 60 * 60 * 1000,  // 하루반 넘게 비면 선 끊기
                tickFmt: (t) => { const p = kstParts(t); return `${p.year.slice(2)}/${+p.month}/${+p.day}`; },
                fullFmt: (t) => kstFullDate(t),
            },
        };

        const META = {
            ph:       { label: 'pH',        short: 'pH',  color: '#e74c3c', unit: '' },
            ec:       { label: 'EC (mS/cm)', short: 'EC',  color: '#e67e22', unit: ' mS/cm' },
            temp:     { label: '온도 (°C)',  short: '온도', color: '#3498db', unit: '°C' },
            humidity: { label: '습도 (%)',   short: '습도', color: '#2ecc71', unit: '%' },
        };

        const statusEl = document.getElementById('status');
        let supabaseClient = null;
        let myChart = null;
        let currentSensor = 'ph';
        let currentMode = 'live';
        let series = { ph: [], ec: [], temp: [], humidity: [] };
        let timer = null;

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.classList.toggle('error', !!isError);
        }

        function toNum(v) {
            return (v === null || v === undefined || v === '') ? null : Number(v);
        }

        // 시각 표시는 항상 한국시간(KST) 고정 — 보는 기기의 시간대와 무관
        function kstParts(t) {
            const o = {};
            for (const p of new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Seoul',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
            }).formatToParts(new Date(t))) o[p.type] = p.value;
            if (o.hour === '24') o.hour = '00';
            return o;
        }

        // 툴팁용 전체 날짜(+요일). t 는 ISO 문자열/date-only 문자열/ms 숫자 다 됨.
        function kstWeekday(t) {
            return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', weekday: 'short' }).format(new Date(t));
        }
        function kstFullDate(t) {
            const p = kstParts(t);
            return `${p.year}-${p.month}-${p.day}(${kstWeekday(t)})`;
        }

        // ---- timeAxis 모드 전용: 눈금을 KST 기준 정시/자정에 맞춰 정렬 ----
        const KST_OFFSET_MS = 9 * 60 * 60 * 1000;

        function alignTick(t, unitMs) {
            if (unitMs >= 24 * 60 * 60 * 1000) {
                const shifted = t + KST_OFFSET_MS;
                return Math.floor(shifted / unitMs) * unitMs - KST_OFFSET_MS;
            }
            return Math.floor(t / unitMs) * unitMs;
        }

        function generateTicks(minT, maxT, unitMs) {
            const ticks = [];
            let t = alignTick(minT, unitMs);
            if (t < minT) t += unitMs;
            for (; t <= maxT; t += unitMs) ticks.push({ value: t });
            if (!ticks.length) ticks.push({ value: alignTick(maxT, unitMs) });
            return ticks;
        }

        // 5분 버킷 데이터를 unitMs 간격(1시간/1일 등)으로 묶어 평균낸다
        // (sensor_hourly/sensor_daily 테이블이 없을 때 sensor_5min 을 대체 소스로 씀)
        function aggregateBuckets(rows, tkey, unitMs) {
            const buckets = new Map();   // bucketTs(ms) -> { ph:[sum,n], ec:[sum,n], ... }
            const keys = ['ph', 'ec', 'temp', 'humidity'];
            for (const r of rows) {
                const t = new Date(r[tkey]).getTime();
                const bucketTs = alignTick(t, unitMs);
                if (!buckets.has(bucketTs)) {
                    buckets.set(bucketTs, { ph: [0, 0], ec: [0, 0], temp: [0, 0], humidity: [0, 0] });
                }
                const b = buckets.get(bucketTs);
                for (const key of keys) {
                    const v = toNum(r[key]);
                    if (v !== null && !Number.isNaN(v)) { b[key][0] += v; b[key][1] += 1; }
                }
            }
            const decimals = { ph: 2, ec: 2, temp: 1, humidity: 1 };
            return Array.from(buckets.keys()).sort((a, b) => a - b).map((bucketTs) => {
                const b = buckets.get(bucketTs);
                const out = { bucketTs };
                for (const key of keys) {
                    out[key] = b[key][1] > 0
                        ? Math.round((b[key][0] / b[key][1]) * 10 ** decimals[key]) / 10 ** decimals[key]
                        : null;
                }
                return out;
            });
        }

        // "전체 기간" 탭처럼 고정 눈금 간격이 없을 때, 실제 데이터 범위에 맞춰 보기 좋은 간격을 고른다
        function pickTickUnit(rangeMs) {
            const DAY_MS = 24 * 60 * 60 * 1000;
            const candidates = [1, 2, 3, 5, 7, 14, 30, 60, 90, 180, 365].map((d) => d * DAY_MS);
            for (const c of candidates) {
                if (rangeMs / c <= 8) return c;
            }
            const years = Math.ceil(rangeMs / (365 * DAY_MS) / 8);
            return years * 365 * DAY_MS;
        }

        // 데이터가 비는 구간은 null 포인트를 끼워 넣어 선을 끊는다 (spanGaps: false 와 세트)
        function buildTimeSeriesPoints(rows, tkey, valueKey, gapThresholdMs) {
            const pts = [];
            let prevT = null;
            for (const r of rows) {
                const t = new Date(r[tkey]).getTime();
                if (prevT !== null && (t - prevT) > gapThresholdMs) {
                    pts.push({ x: prevT + 1, y: null });
                }
                pts.push({ x: t, y: toNum(r[valueKey]) });
                prevT = t;
            }
            return pts;
        }

        function initClient() {
            const url = window.SUPABASE_URL;
            const key = window.SUPABASE_ANON_KEY;
            if (!url || !key || String(key).includes('YOUR_')) {
                setStatus('config.js 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 설정하세요.', true);
                return false;
            }
            supabaseClient = window.supabase.createClient(url, key);
            return true;
        }

        // ---- 그래프 데이터 (모드별) ----
        async function loadChartData() {
            const m = MODES[currentMode];
            let q = supabaseClient
                .from(m.table)
                .select(m.select)
                .gte(m.tkey, new Date(Date.now() - m.sinceMs).toISOString())
                .order(m.tkey, { ascending: true })
                .limit(m.cap);
            if (DEVICE_ID) q = q.eq('device_id', DEVICE_ID);

            const { data, error } = await q;
            if (error) {
                setStatus('그래프 조회 오류: ' + error.message, true);
                return;
            }

            series = { ph: [], ec: [], temp: [], humidity: [] };
            const rows = m.aggregateUnitMs ? aggregateBuckets(data || [], m.tkey, m.aggregateUnitMs) : (data || []);
            const rowsTkey = m.aggregateUnitMs ? 'bucketTs' : m.tkey;
            for (const key of ['ph', 'ec', 'temp', 'humidity']) {
                const valueKey = m.aggregateUnitMs ? key : m.col[key];
                series[key] = buildTimeSeriesPoints(rows, rowsTkey, valueKey, m.gapThresholdMs);
            }
            drawChart(currentSensor);

            const modeLabel = m.title;
            if (!data || data.length === 0) {
                setStatus(modeLabel + ' · 표시할 데이터 없음');
            } else {
                setStatus(modeLabel + ' · ' + data.length + '개 지점 · ' + nowHm() + ' KST 갱신');
            }
        }

        // ---- 카드 값: 항상 원본 최신 1행 ----
        async function loadLatest() {
            const raw = MODES.live;
            let q = supabaseClient
                .from(raw.table)
                .select(raw.select)
                .order('created_at', { ascending: false })
                .limit(1);
            if (DEVICE_ID) q = q.eq('device_id', DEVICE_ID);

            const { data, error } = await q;
            if (error || !data || !data.length) return;
            const r = data[0];
            setValue('ph', r[raw.col.ph]);
            setValue('ec', r[raw.col.ec]);
            setValue('temp', r[raw.col.temp]);
            setValue('humidity', r[raw.col.humidity]);
        }

        function setValue(key, v) {
            const n = toNum(v);
            document.getElementById('val-' + key).textContent =
                (n === null || Number.isNaN(n)) ? '--' : n;
        }

        function nowHm() {
            const p = kstParts(Date.now());
            return `${p.hour}:${p.minute}`;
        }

        function drawChart(sensorKey) {
            const m = MODES[currentMode];
            const meta = META[sensorKey];
            const ctx = document.getElementById('sensorChart').getContext('2d');
            if (myChart) myChart.destroy();

            const points = series[sensorKey];
            const dataset = {
                label: meta.label + ' · ' + m.unit,
                data: points,
                borderColor: meta.color,
                backgroundColor: meta.color + '22',
                borderWidth: 2.5,
                pointRadius: points.length > 60 ? 0 : 3,
                fill: true,
                tension: 0.3,
                spanGaps: false,   // 데이터 없는 구간은 선으로 잇지 않는다
            };

            // 실제 timestamp 기반 축: 눈금은 고정/가변 간격으로, 점은 원래 시각 그대로
            let minT, maxT;
            if (m.dataRangeAxis) {
                const xs = points.map((p) => p.x);
                minT = xs.length ? Math.min(...xs) : Date.now() - 24 * 60 * 60 * 1000;
                maxT = xs.length ? Math.max(...xs) : Date.now();
            } else {
                const now = Date.now();
                minT = alignTick(now - m.sinceMs, m.tickUnitMs);
                maxT = now;
            }
            const tickUnitMs = m.tickUnitMs || pickTickUnit(maxT - minT || 1);

            myChart = new Chart(ctx, {
                type: 'line',
                data: { datasets: [dataset] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                title: (items) => items.length ? m.fullFmt(items[0].parsed.x) : '',
                                label: (item) => {
                                    const v = item.parsed.y;
                                    return v === null || v === undefined
                                        ? meta.short + ': 값 없음'
                                        : meta.short + ': ' + v + meta.unit;
                                },
                            },
                        },
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: minT,
                            max: maxT,
                            afterBuildTicks: (scale) => {
                                scale.ticks = generateTicks(minT, maxT, tickUnitMs);
                            },
                            ticks: {
                                callback: (val) => m.tickFmt(val),
                                maxRotation: 0,
                            },
                        },
                        y: { beginAtZero: false },
                    },
                },
            });
        }

        function switchSensor(sensorKey) {
            currentSensor = sensorKey;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + sensorKey).classList.add('active');
            drawChart(sensorKey);
        }

        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            for (const key of Object.keys(MODES)) {
                document.getElementById(MODES[key].btn).classList.toggle('active', key === mode);
            }
            startPolling();   // 새 모드로 즉시 조회 + 주기 재설정
        }

        function refreshNow() {
            if (!supabaseClient) return;
            loadChartData();
            loadLatest();
        }

        function startPolling() {
            if (timer) clearInterval(timer);
            const tick = () => {
                if (document.hidden) return;   // 안 보이는 탭은 요청 안 함 (egress 절약)
                refreshNow();
            };
            tick();
            timer = setInterval(tick, MODES[currentMode].refreshMs);
        }

        window.onload = function () {
            drawChart('ph');            // 빈 차트 먼저
            if (!initClient()) return;
            startPolling();
            // 탭이 다시 보이면 즉시 한 번 갱신
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) refreshNow();
            });
        };
    </script>


</body></html>
